name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[evaluation]' build
      - run: python tools/checks/check.py
      - run: python -m build
      - run: python tools/checks/check_distribution.py dist/track4d_calib-*.whl
      - name: Check source distribution
        run: |
          mkdir "${RUNNER_TEMP}/source"
          tar -xzf dist/track4d_calib-*.tar.gz -C "${RUNNER_TEMP}/source"
          cd "${RUNNER_TEMP}"/source/track4d_calib-*/
          python tools/checks/check.py
